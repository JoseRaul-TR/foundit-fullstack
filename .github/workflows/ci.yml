# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The deploy job below fires Render's deploy hook, and a hook bypasses
    # Render's own Build Filters entirely -- they only apply to its auto-deploy,
    # which is off. So the filtering has to happen here.
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"

# Least privilege: neither job writes to the repository. Declaring it here
# keeps the token read-only regardless of the repository-level default.
permissions:
  contents: read

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest

    services:
      # apps/api's suite runs `prisma migrate deploy` against a real database
      # before vitest. Credentials and database name must match what
      # apps/api/.env.test expects, since tests/setup.ts loads that file with
      # override:true and it therefore wins over anything set here.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foundit
          POSTGRES_PASSWORD: foundit_dev
          POSTGRES_DB: foundit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundit -d foundit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # pnpm/setup replaces both pnpm/action-setup and actions/setup-node:
      # it installs pnpm as a standalone native binary and the JS runtime in
      # one step. pnpm's own README directs pnpm 11+ users here; the old
      # action stays on the deprecated Node 20 runtime and remains only for
      # pnpm 10 and older.
      #
      # `version` is deliberately omitted: the action reads
      # devEngines.packageManager from the root package.json, so the pinned
      # pnpm version lives in exactly one place.
      #
      # node@22 matches the Dockerfile's base image, so CI exercises the same
      # runtime as production rather than whatever is newest.
      #
      # install:false because we run the install ourselves below — the action
      # would otherwise do it implicitly, and the explicit --frozen-lockfile
      # is worth keeping visible.
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      # postinstall runs `prisma generate` and `nuxt prepare`, both of which
      # the typecheck and test steps below depend on.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      # apps/api/.env.test is gitignored, but tests/setup.ts loads it with
      # override:true — anything set in this workflow's env would lose to it.
      # The committed template is the single source of truth for those values;
      # they're all dummies, since TMDB and Google are mocked in every suite.
      - name: Provide test environment
        run: cp apps/api/.env.test.example apps/api/.env.test

      - run: pnpm test

  deploy:
    name: Deploy to Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Render's Auto-Deploy is turned OFF so that deploys go through this
      # gate instead: `needs: ci` means a push to main with failing checks
      # never reaches production. -f makes curl fail the step on a non-2xx
      # response, so a broken hook surfaces instead of passing silently.
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
