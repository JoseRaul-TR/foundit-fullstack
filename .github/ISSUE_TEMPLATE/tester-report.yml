name: Tester report
description: Something went wrong, or did not work the way you expected, while testing FoundIt.
title: "[Tester] "
labels: ["tester-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing FoundIt.

        Write in whichever language is easiest for you — English, Swedish or Spanish.

        If you want to share an opinion rather than report something broken, the
        [short feedback form](https://forms.gle/URwj1YuMEk9Ru8Ar8) is the better door
        and takes three minutes.

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can I reproduce it?
      description: Rough steps are fine — "searched for Dune, opened the first result, tapped the bookmark".
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Which page?
      description: Paste the URL from the address bar if you can. It is worth five sentences of description.
      placeholder: https://foundit-fullstack.onrender.com/es/watchlist
    validations:
      required: false

  - type: dropdown
    id: language
    attributes:
      label: Which language were you using the app in?
      options:
        - English
        - Español
        - Svenska
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: signed-in
    attributes:
      label: Were you signed in?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: browser-device
    attributes:
      label: Browser and device
      placeholder: Chrome on a Pixel 7 / Safari on an iPhone / Firefox on a MacBook
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots help a lot. You can paste an image straight into this box.
    validations:
      required: false
